[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-commerce-semantics-governance-pack"
version = "0.1.0"
description = "Installable SSOT governance pack for customer commerce semantics, products, offers, orders, invoices, reviews, ratings, and conversion actions."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
dependencies = [
  "ssot-pack-contracts>=0.2.17,<0.3.0",
  "tomli>=2.0.1; python_version < '3.11'",
]
keywords = [
  "ssot",
  "ssot-registry",
  "ssot-pack-contracts",
  "governance-pack",
  "governance",
  "adr",
  "spec",
  "architecture-decision-records",
  "conformance",
  "compliance",
  "customer-commerce",
  "schema-org",
  "structured-data",
  "product",
  "offer",
  "order",
  "invoice",
  "review",
  "gs1",
  "semantic-web",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business",
  "Topic :: Database",
  "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/groupsum/customer-commerce-semantics-governance-pack"
Repository = "https://github.com/groupsum/customer-commerce-semantics-governance-pack"
Issues = "https://github.com/groupsum/customer-commerce-semantics-governance-pack/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ssot_pack_customer_commerce_semantics" = ["metadata.json"]
"ssot_pack_customer_commerce_semantics.templates.adr" = ["*.json", "*.yaml"]
"ssot_pack_customer_commerce_semantics.templates.specs" = ["*.json", "*.yaml"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
