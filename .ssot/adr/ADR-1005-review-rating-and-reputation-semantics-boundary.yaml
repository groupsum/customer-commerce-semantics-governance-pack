body: |-
  ## Context
  
  Reviews and ratings describe reputation, customer feedback, and evaluated items. They are commonly displayed beside product and offer data but carry separate authorship, target, rating scale, and aggregation semantics.
  
  ## Decision
  
  Review and rating source curation covers Schema.org Review, Rating, and AggregateRating targets. Review/rating targets must remain separate from product facts, offer terms, order state, invoice state, and commerce action records.
  
  ## Authority Sources
  
  - Schema.org Review.
  - Schema.org Rating.
  - Schema.org AggregateRating.
