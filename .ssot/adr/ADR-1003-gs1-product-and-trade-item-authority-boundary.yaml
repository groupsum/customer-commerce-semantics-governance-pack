body: |-
  ## Context
  
  GS1 Web Vocabulary provides semantic vocabulary for product, organization, location, offer, and trade item data used in commerce and supply-chain contexts.
  
  ## Decision
  
  GS1 source curation covers product identifiers, trade item semantics, organization/location semantics, and related product vocabulary fields governed by GS1 Web Vocabulary. GS1 targets must remain separate from Schema.org public structured-data targets unless an explicit mapping target is curated.
  
  ## Authority Sources
  
  - GS1 Web Vocabulary.
